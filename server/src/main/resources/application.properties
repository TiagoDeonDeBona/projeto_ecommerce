spring.application.name=server
server.port=8080 
#porta padrao

# Conexão com H2
# map gere aitp,atoca,emte i, mp,e a;eatprop [ara p bamcp
spring.datasource.generate-unique-name=false
# nome fixo do banco
# aqui o nome foi separado | jdbc:h2: -> Estou usando H2 | mem: -> banco ficas em memoria | testedb -> nome do banco
spring.datasource.url=jdbc:h2:mem:testdb
# Ou seja no H2-CONSOLE nao vai mais ter aqueles caracteres aleatorios para conectar sempre vai ser esse padrao
# Habilita a interface web creio que por padrao ele ja é true
spring.h2.console.enabled=true
# Define o caminho que assim ja é padrao
spring.h2.console.path=/h2-console
# Faz o hibernate mostrar como ele ta fazendo os comandos SQL
spring.jpa.show-sql=true